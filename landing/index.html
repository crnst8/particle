<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>particle — a self-hosted read-later app</title>
  <meta name="description" content="A self-hosted read-later app that reliably saves, cleans, organises and reads articles across devices.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">

  <meta property="og:title" content="particle — a self-hosted read-later app">
  <meta property="og:description" content="Reliably save, clean, organise and read articles across devices.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://particle.crnst8.com">
  <script defer src="https://stats.crnst8.com/script.js" data-website-id="d08755be-71ec-4714-b06d-b53b8550c595"></script>

  <style>
    :root {
      --accent: #ef6547;
      --ink: #080808;
      --paper: #ffffff;
      --mono: "Paper Mono", "Courier New", Courier, ui-monospace, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 20rem;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--mono);
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      position: relative;
      min-height: 48rem;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
    }

    .composition {
      position: absolute;
      top: calc(50% - 17.75rem);
      left: 0;
      width: 100%;
      height: 38.5rem;
      text-align: center;
      transform-origin: 50% 50%;
    }

    .mark {
      position: absolute;
      top: 0;
      left: 50%;
      width: 1.3125rem;
      height: 1.3125rem;
      border: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 43% 34%, #f6805c 0 7%, transparent 8%),
        radial-gradient(circle at 44% 39%, #ef714f 0 45%, #e45337 69%, #be3824 100%);
      box-shadow: 0 .04rem .08rem rgb(88 25 13 / 45%);
      transform: translateX(-50%);
    }

    h1 {
      position: absolute;
      top: 1.875rem;
      left: 0;
      width: 100%;
      margin: 0;
      font: 700 .9375rem/1 var(--mono);
      letter-spacing: -.04em;
    }

    .devices {
      position: absolute;
      top: 4.3125rem;
      left: 50%;
      width: min(21.9375rem, 97vw);
      aspect-ratio: 351 / 321;
      margin: 0;
      transform: translateX(-50%);
    }

    .devices img {
      position: absolute;
      top: 0;
      display: block;
      object-fit: fill;
    }

    .tablet {
      right: 0;
      z-index: 1;
      width: 65.67%;
      height: 99.69%;
    }

    .phone {
      left: 0;
      z-index: 2;
      width: 46.44%;
      height: 100%;
    }

    .description {
      position: absolute;
      top: 26.5rem;
      left: 50%;
      width: min(18rem, 88vw);
      margin: 0;
      font-size: .8125rem;
      font-weight: 400;
      line-height: 1.02;
      letter-spacing: -.04em;
      transform: translateX(-50%);
    }

    .actions {
      position: absolute;
      top: 32.1875rem;
      left: 50%;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      width: min(24.0625rem, calc(100vw - .9375rem));
      transform: translateX(-50%);
    }

    .actions a {
      color: inherit;
      font-size: .9375rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.04em;
      text-decoration-line: underline;
      text-decoration-thickness: .0625rem;
      text-underline-offset: .08em;
    }

    .actions a:hover,
    .actions a:focus-visible {
      color: #e65337;
    }

    .actions a:focus-visible {
      border-radius: .1rem;
      outline: .125rem solid currentColor;
      outline-offset: .2rem;
    }

    .studio {
      position: absolute;
      top: 35.6875rem;
      left: 0;
      width: 100%;
    }

    .studio a {
      display: inline-flex;
      align-items: center;
      gap: .1875rem;
      color: inherit;
      font-family: "Neue Haas Grotesk Text Pro", "Neue Haas Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: .40625rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.025em;
      text-decoration: none;
    }

    .studio img {
      display: block;
      width: .6875rem;
      height: .6875rem;
    }

    .studio a:hover,
    .studio a:focus-visible {
      opacity: .62;
    }

    .studio a:focus-visible {
      border-radius: .1rem;
      outline: .125rem solid currentColor;
      outline-offset: .2rem;
    }

    @media (min-width: 75rem) {
      .composition {
        transform: scale(1.12);
      }
    }

    @media (max-width: 30rem) {
      .actions a {
        font-size: .8125rem;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .actions a {
        transition: color 120ms ease;
      }

      .studio a {
        transition: opacity 120ms ease;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="composition">
      <span class="mark" aria-hidden="true"></span>
      <h1>particle</h1>

      <figure class="devices" aria-label="Particle running on a phone and tablet">
        <img class="tablet" src="ipad.png" width="903" height="1276" alt="Particle's distraction-free article reader on a tablet">
        <img class="phone" src="phone.png" width="529" height="1011" alt="The Particle article library on a phone">
      </figure>

      <p class="description">
        a self-hosted read-later app<br>
        that reliably saves, cleans, organises<br>
        and reads articles across devices.
      </p>

      <nav class="actions" aria-label="Get particle">
        <a href="https://github.com/crnst8/particle#quick-start">get started</a>
        <a href="/try">try the demo</a>
        <a href="https://github.com/crnst8/particle">github</a>
      </nav>

      <footer class="studio">
        <a href="https://crnst8.com" aria-label="Current State Projects">
          <img src="current-state-mark.png" width="3000" height="3000" alt="">
          <span>Current State Projects</span>
        </a>
      </footer>
    </div>
  </main>
</body>
</html>
